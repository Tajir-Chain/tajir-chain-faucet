name: Devnet CI/CD Pipeline

on:
  push:
    branches:
      - devnet

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from package.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./web/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=tajir-v$VERSION" >> $GITHUB_OUTPUT
          echo "image_tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
            GIT_TAG=${{ steps.get_version.outputs.tag }}
          tags: |
            tajirchain/tajir-faucet:${{ steps.get_version.outputs.image_tag }}
            tajirchain/tajir-faucet:latest

      - name: Create Git Tag
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          TAG_NAME="${{ steps.get_version.outputs.tag }}"
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists, skipping tagging."
          else
            git tag "$TAG_NAME"
            git push origin "$TAG_NAME"
          fi
